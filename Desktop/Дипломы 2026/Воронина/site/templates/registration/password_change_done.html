{% extends "base.html" %}

{% block title %}Пароль изменён — {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="card auth-card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="icon-badge icon-badge-lg mx-auto mb-3"><i class="bi bi-shield-check"></i></div>
        <h1 class="h3 fw-bold mb-3">Пароль успешно изменён</h1>
        <p class="text-muted mb-4">Ваш пароль обновлён. Используйте новый пароль при следующем входе.</p>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
          <a href="{% url 'home' %}" class="btn btn-primary">На главную</a>
          <a href="{% url 'logout' %}" class="btn btn-outline-primary">Выйти</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
