{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Смена пароля — {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7 col-xl-6">
    <div class="card auth-card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="mb-4">
          <span class="badge rounded-pill text-bg-primary-subtle text-primary border border-primary-subtle hero-badge mb-3">
            Безопасность аккаунта
          </span>
          <h1 class="h3 fw-bold mb-2">Смена пароля</h1>
          <p class="text-muted mb-0">Введите текущий пароль и задайте новый.</p>
        </div>

        <form method="post" novalidate>
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary w-100 mt-3">
            <i class="bi bi-check2-circle me-2"></i>Сохранить новый пароль
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
