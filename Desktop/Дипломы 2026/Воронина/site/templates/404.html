{% extends "base.html" %}

{% block title %}Страница не найдена — {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="card auth-card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="icon-badge icon-badge-lg mx-auto mb-3"><i class="bi bi-search"></i></div>
        <h1 class="display-6 fw-bold mb-3">404</h1>
        <h2 class="h4 fw-semibold mb-3">Страница не найдена</h2>
        <p class="text-muted mb-4">
          Возможно, ссылка устарела или адрес введён с ошибкой. Вернитесь на главную и попробуйте ещё раз.
        </p>
        <a href="{% url 'core:home' %}" class="btn btn-primary">На главную</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
