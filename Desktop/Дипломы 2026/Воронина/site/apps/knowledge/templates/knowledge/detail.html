{% extends "base.html" %}

{% block content %}
<section class="py-4 py-lg-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <article class="card border-0 shadow-sm overflow-hidden">
          {% if article.cover_url %}
            <img src="{{ article.cover_url }}" class="card-img-top" alt="{{ article.title }}" style="max-height: 420px; object-fit: cover;">
          {% endif %}
          <div class="card-body p-4 p-lg-5">
            <div class="d-flex flex-wrap align-items-center gap-3 text-secondary small mb-3">
              <span><i class="bi bi-calendar3 me-1"></i>{{ article.published_at|date:"d.m.Y H:i" }}</span>
              <span><i class="bi bi-eye me-1"></i>{{ article.views_count }}</span>
            </div>
            <h1 class="fw-bold mb-3">{{ article.title }}</h1>
            <p class="lead text-secondary mb-4">{{ article.excerpt }}</p>
            <div class="fs-6 lh-lg">
              {{ article.content|linebreaks }}
            </div>
          </div>
        </article>

        <div class="mt-4">
          <a href="{% url 'knowledge:index' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>К списку статей
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
