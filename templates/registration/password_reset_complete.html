{% extends "base.html" %}

{% block title %}Пароль обновлён — {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="card auth-card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="icon-badge icon-badge-lg mx-auto mb-3"><i class="bi bi-lock-fill"></i></div>
        <h1 class="h3 fw-bold mb-3">Пароль успешно обновлён</h1>
        <p class="text-muted mb-4">Теперь вы можете войти в систему с новым паролем.</p>
        <a href="{% url 'login' %}" class="btn btn-primary">Войти в систему</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
