{% extends "base.html" %}

{% block title %}Письмо отправлено — {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <div class="card auth-card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="icon-badge icon-badge-lg mx-auto mb-3"><i class="bi bi-envelope-check"></i></div>
        <h1 class="h3 fw-bold mb-3">Письмо с инструкциями отправлено</h1>
        <p class="text-muted mb-4">
          Если адрес существует в системе, на него будет отправлена ссылка для установки нового пароля.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary">Вернуться ко входу</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
