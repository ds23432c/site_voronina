{% extends "base.html" %}

{% block title %}{{ title }} — БухПомощник{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
    <div>
      <p class="text-primary fw-semibold mb-1">Экспорт</p>
      <h1 class="h3 mb-0">{{ title }}</h1>
    </div>
    <a href="{{ download_url }}" class="btn btn-primary">Скачать TXT</a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <pre class="mb-0 text-wrap">{{ export_text }}</pre>
    </div>
  </div>
</div>
{% endblock %}
